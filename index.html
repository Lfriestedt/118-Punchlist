<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>118 Punch List</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #EEF0F2; --surface: #FFFFFF; --ink: #18202B; --muted: #5B6675; --line: #D3D8DE;
  --tape: #F2C230; --tape-ink: #2A2100; --done: #2F7D4F; --danger: #B3261E; --pc: #E2541B;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161C; --surface: #1C222B; --ink: #E9EDF2; --muted: #9AA5B3; --line: #2E3642;
    --tape: #E8B923; --tape-ink: #1E1700; --done: #5FBF84; --danger: #F2847C; --pc: #F2763F;
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; line-height: 1.45; }
img { max-width: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--tape); outline-offset: 2px; }

.wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 130px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.link { background: none; border: 0; padding: 8px 0; color: var(--muted); font-weight: 500; text-decoration: none; }
.link:hover { color: var(--ink); }
h1, h2, .unitno, .big { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; }
h1 { font-size: 36px; font-weight: 800; margin: 8px 0 4px; }
h2 { font-size: 24px; font-weight: 800; margin: 32px 0 6px; }
.sub { color: var(--muted); margin: 0 0 20px; }

.unitno { font-weight: 800; font-size: clamp(88px, 28vw, 168px); line-height: .85; letter-spacing: -.02em; margin: 12px 0 6px; }
.pagetitle { font-weight: 800; font-size: clamp(48px, 14vw, 88px); line-height: .9; margin: 12px 0 6px; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; }
.unitmeta { color: var(--muted); margin-bottom: 20px; }

.stats { display: flex; gap: 28px; margin: 12px 0 8px; flex-wrap: wrap; }
.stat .big { font-size: 56px; font-weight: 800; line-height: 1; }
.stat span { color: var(--muted); font-size: 15px; }

.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.rows li { border-bottom: 1px solid var(--line); }
.rows button { width: 100%; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; background: none; border: 0; padding: 12px 4px; text-align: left; }
.rows .n { font-weight: 600; }
.rows.units .n { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: 28px; font-weight: 800; }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; align-self: center; max-width: 160px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--tape); }
.count { color: var(--muted); white-space: nowrap; }
.count b { color: var(--ink); }

.room { margin: 26px 0 8px; font-weight: 600; font-size: 15px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.item { background: var(--surface); border-left: 6px solid var(--tape); border-radius: 4px; padding: 12px 14px; margin: 10px 0; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
.item.done { border-left-color: var(--done); opacity: .75; }
.item h3 { margin: 0; font-size: 18px; font-weight: 600; }
.item.done h3 { text-decoration: line-through; }
.item .where { font-size: 14px; color: var(--muted); margin-bottom: 2px; }
.item p { margin: 4px 0 0; color: var(--muted); font-size: 15px; white-space: pre-wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { font-size: 13px; font-weight: 500; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); }
.chip.none { color: var(--muted); border-style: dashed; }
.when { font-size: 13px; color: var(--muted); margin-top: 6px; }
.thumb { width: 84px; height: 84px; border-radius: 3px; background: var(--line); border: 0; padding: 0; overflow: hidden; }
.thumb img { width: 84px; height: 84px; object-fit: cover; display: block; }
.actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 8px 14px; font-weight: 500; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.warn { color: var(--danger); }
.btn.warn.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.donebox summary { cursor: pointer; color: var(--muted); margin-top: 28px; font-weight: 500; }
.empty { padding: 28px 0; color: var(--muted); }
.foot { margin-top: 48px; color: var(--muted); font-size: 14px; display: flex; gap: 16px; flex-wrap: wrap; }

.fabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 12px; z-index: 10; width: max-content; max-width: calc(100% - 32px); }
.fabs[hidden] { display: none; }
.fab { background: var(--tape); color: var(--tape-ink); border: 0; border-radius: 999px; padding: 14px 26px; font-weight: 600; font-size: 18px; box-shadow: 0 6px 18px rgba(0,0,0,.18); white-space: nowrap; }
.fab.cam { width: 56px; height: 56px; padding: 0; display: grid; place-items: center; background: var(--ink); color: var(--bg); }
.fab.cam svg { width: 26px; height: 26px; }
.qmedia { width: 100%; max-height: 34vh; object-fit: contain; background: #000; border-radius: 4px; display: block; }
.qbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 6px; }
.ai { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.ai.ok { color: var(--done); }
.ai.bad { color: var(--danger); }
.ai .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ai .dot { animation: none; } }
.choices { display: grid; gap: 10px; }
.choices .btn { padding: 16px; font-size: 18px; text-align: left; display: flex; gap: 12px; align-items: center; }
.vbadge { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; padding: 1px 5px; border-radius: 3px; }
.thumb { position: relative; }
.viewer video { max-height: 100%; max-width: 100%; }

.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 20; }
.sheet-bg.open { display: block; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: 12px 12px 0 0; max-height: 92%; overflow-y: auto; transform: translateY(105%); transition: transform .22s ease; padding: 18px 18px calc(20px + env(safe-area-inset-bottom, 0px)); max-width: 760px; margin: 0 auto; }
.sheet.open { transform: none; }
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
.sheet h2 { margin: 0 0 10px; font-size: 28px; }
label { display: block; font-weight: 500; font-size: 15px; margin: 12px 0 4px; }
input[type=text], textarea, select { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
textarea { min-height: 72px; resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
.photo-pick { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px dashed var(--muted); border-radius: 4px; background: var(--bg); margin-top: 4px; cursor: pointer; }
.photo-pick img { width: 64px; height: 64px; object-fit: cover; border-radius: 3px; }
.btns { display: flex; gap: 10px; margin-top: 18px; }
.btns .btn { flex: 1; padding: 13px; }
.err { color: var(--danger); font-size: 14px; margin-top: 10px; }

.viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 30; display: none; align-items: center; justify-content: center; padding: 20px; color: #fff; }
.viewer.open { display: flex; }
.viewer img { max-height: 100%; max-width: 100%; }

#toast { position: fixed; left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-weight: 500; transition: opacity .2s, transform .2s; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

.qrgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin-top: 16px; }
.qrcard { background: #fff; color: #000; border-radius: 4px; padding: 14px; text-align: center; break-inside: avoid; }
.qrcard .qr { display: flex; justify-content: center; }
.qrcard .qr img, .qrcard .qr canvas { width: 140px; height: 140px; }
.qrcard .n { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 800; font-size: 34px; line-height: 1; margin-top: 8px; }
.addunit { display: flex; gap: 8px; margin-top: 10px; }
.addunit input { flex: 1; }
.sharebox { display: flex; gap: 8px; margin: 4px 0 8px; }
.sharebox input { flex: 1; font-size: 14px; }

/* ---------- mode tabs + Procore section ---------- */
.modetabs { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; margin: 4px 0 8px; }
.modetabs button { flex: 1; border: 0; background: none; padding: 9px 10px; border-radius: 6px; font-weight: 600; color: var(--muted); }
.modetabs button.on { background: var(--ink); color: var(--bg); }
.choose { display: grid; gap: 14px; margin-top: 18px; }
.choose button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-left: 8px solid var(--tape); border-radius: 6px; padding: 20px 18px; }
.choose button.pc { border-left-color: var(--pc); }
.choose .t { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 800; font-size: 34px; line-height: 1; display: block; }
.choose .d { color: var(--muted); font-size: 15px; display: block; margin-top: 6px; }
.pcnav { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin: 6px 0 14px; scrollbar-width: none; }
.pcnav button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.pcnav button.on { color: var(--ink); border-bottom-color: var(--pc); }
.pchead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pchead .proj { font-size: 14px; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; background: var(--surface); border-radius: 6px; padding: 14px; margin: 10px 0; font-size: 15px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 12px 0; }
.tile { background: var(--surface); border-radius: 6px; padding: 12px 14px; border: 1px solid var(--line); text-align: left; }
.tile .big { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: 40px; font-weight: 800; line-height: 1; }
.tile span { color: var(--muted); font-size: 14px; }
.transfer { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; margin: 12px 0; }
.transfer .btn.primary { width: 100%; padding: 14px; font-size: 18px; }
.transfer p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 12px; }
.filters input, .filters select { width: auto; flex: 1 1 140px; padding: 9px 10px; }
.sheetrow { width: 100%; display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: center; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 11px 4px; text-align: left; }
.sheetrow .no { font-weight: 600; }
.sheetrow .meta { color: var(--muted); font-size: 13px; white-space: nowrap; text-align: right; }
.disc { margin: 22px 0 4px; font-weight: 600; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--pc); color: #fff; font-size: 12px; font-weight: 600; text-align: center; }
.badge.gray { background: var(--line); color: var(--ink); }
.status { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em; }
.status.open { background: var(--tape); color: var(--tape-ink); }
.status.closed { background: var(--done); color: #fff; }
.pcitem { background: var(--surface); border-left: 6px solid var(--pc); border-radius: 4px; padding: 12px 14px; margin: 10px 0; display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.pcitem.closed { border-left-color: var(--done); opacity: .8; }
.pcitem h3 { margin: 2px 0; font-size: 18px; font-weight: 600; }
.pcitem .num { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.pcitem .loc { font-size: 14px; color: var(--muted); }
.pz-wrap { position: relative; margin: 0 -16px; }
.pz { position: relative; height: calc(100vh - 250px); height: calc(100dvh - 250px); min-height: 360px; overflow: hidden; background: #DDE1E6; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
@media (prefers-color-scheme: dark) { .pz { background: #0B0E12; } }
.pz-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.pz-inner img, .pz-ph { width: 100%; height: 100%; display: block; pointer-events: none; }
.pz-ph { background: #fff; color: #5B6675; display: grid; place-items: center; text-align: center; font-size: 34px; background-image: linear-gradient(#e6e9ed 1px, transparent 1px), linear-gradient(90deg, #e6e9ed 1px, transparent 1px); background-size: 50px 50px; }
.pin { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: var(--tape); color: var(--tape-ink); border: 2px solid #000; font: 600 12px/26px "Barlow", sans-serif; text-align: center; transform: scale(var(--inv, 1)); box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.pin.closed { background: var(--done); color: #fff; }
.pin.sel { outline: 4px solid var(--pc); outline-offset: 2px; }
.pztools { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
.pztools button { width: 42px; height: 42px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
.placing { position: absolute; left: 10px; right: 64px; top: 10px; z-index: 2; background: var(--pc); color: #fff; border-radius: 6px; padding: 10px 12px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.placing button { background: #fff; color: #000; border: 0; border-radius: 4px; padding: 6px 10px; font-weight: 600; }
.placing[hidden] { display: none; }
.pz.placing-mode { cursor: crosshair; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.gallery button { position: relative; aspect-ratio: 1; border: 0; padding: 0; border-radius: 3px; overflow: hidden; background: var(--line); }
.gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery .cap { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 2px 5px; text-align: left; }
.progress { font-size: 14px; color: var(--muted); margin-top: 8px; }
@media print { .top, .fab, .addunit, .sub, .foot, .noprint { display: none !important; } body { background: #fff; } }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">Loading punch list…</p></div>
<div class="fabs" id="fab" hidden>
  <button class="fab cam" id="camBtn" type="button" aria-label="Capture photo or video for Claude to log">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2.2l1.4-2h6.8l1.4 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>
  </button>
  <button class="fab" id="addBtn" type="button">+ Add item</button>
</div>
<input type="file" id="cPhoto" accept="image/*" capture="environment" hidden>
<input type="file" id="cVideo" accept="video/*" capture="environment" hidden>
<input type="file" id="cLib" accept="image/*,video/*" hidden>

<div class="sheet-bg" id="cBg"></div>
<div class="sheet" id="cSheet" role="dialog" aria-label="Capture">
  <h2>Capture</h2>
  <div class="choices">
    <button type="button" class="btn" data-pick="cPhoto">📷 Take photo</button>
    <button type="button" class="btn" data-pick="cVideo">🎥 Record video</button>
    <button type="button" class="btn" data-pick="cLib">🖼️ Choose from library</button>
  </div>
  <div class="btns"><button type="button" class="btn" id="cCancel">Cancel</button></div>
</div>

<div class="sheet-bg" id="qBg"></div>
<form class="sheet" id="qSheet" autocomplete="off">
  <h2>New item from capture</h2>
  <div id="qMedia"></div>
  <div class="qbar">
    <div class="ai" id="qAI" role="status"></div>
    <button type="button" class="link" id="qRetake">Retake</button>
  </div>
  <div class="row">
    <div><label for="qUnit">Unit</label><input type="text" id="qUnit" list="qUnits" placeholder="202" required inputmode="numeric"></div>
    <div><label for="qRoom">Room</label><select id="qRoom"></select></div>
  </div>
  <datalist id="qUnits"></datalist>
  <label for="qTitle">Problem</label>
  <input type="text" id="qTitle" placeholder="Claude fills this in">
  <label for="qNotes">Notes for the worker</label>
  <textarea id="qNotes"></textarea>
  <div class="row">
    <div><label for="qTrade">Trade</label><select id="qTrade"></select></div>
    <div><label for="qWho">Assigned to</label><input type="text" id="qWho" list="qPeople"></div>
  </div>
  <datalist id="qPeople"></datalist>
  <div class="err" id="qErr" hidden></div>
  <div class="btns">
    <button type="button" class="btn" id="qCancel">Cancel</button>
    <button type="button" class="btn" id="qNext">Save + next</button>
    <button type="submit" class="btn primary" id="qSave">Save</button>
  </div>
</form>

<div class="sheet-bg" id="kBg"></div>
<form class="sheet" id="kSheet" autocomplete="off">
  <h2>Claude auto-fill</h2>
  <p style="color:var(--muted);margin:0 0 8px">Paste an Anthropic API key (from console.anthropic.com). It stays on this device only and is sent only to Anthropic.</p>
  <label for="kKey">API key</label>
  <input type="password" id="kKey" placeholder="sk-ant-…" autocomplete="off" spellcheck="false">
  <div class="err" id="kErr" hidden></div>
  <div class="btns">
    <button type="button" class="btn" id="kRemove">Remove key</button>
    <button type="button" class="btn" id="kCancel">Cancel</button>
    <button type="submit" class="btn primary" id="kSave">Save</button>
  </div>
</form>

<div class="sheet-bg" id="sheetBg"></div>
<form class="sheet" id="sheet" autocomplete="off">
  <h2 id="sheetTitle">New punch item</h2>
  <div class="row">
    <div><label for="fUnit">Unit</label><input type="text" id="fUnit" placeholder="202" required></div>
    <div><label for="fRoom">Room</label><input type="text" id="fRoom" list="rooms" placeholder="Kitchen" required></div>
  </div>
  <datalist id="rooms"></datalist>
  <label for="fTitle">Problem</label>
  <input type="text" id="fTitle" placeholder="Light switch cover missing" required>
  <label for="fNotes">Notes for the worker (optional)</label>
  <textarea id="fNotes" placeholder="Left of the fridge, by the pantry door"></textarea>
  <div class="row">
    <div><label for="fTrade">Trade</label><select id="fTrade"></select></div>
    <div><label for="fWho">Assigned to (optional)</label><input type="text" id="fWho" list="people" placeholder="Mike"></div>
  </div>
  <datalist id="people"></datalist>
  <label for="fPhoto">Photo</label>
  <label class="photo-pick" for="fPhoto"><img id="fPreview" alt="" hidden><span id="fPhotoText">Take or choose a photo</span></label>
  <input type="file" id="fPhoto" accept="image/*" capture="environment" hidden>
  <div class="err" id="fErr" hidden></div>
  <div class="btns">
    <button type="button" class="btn" id="fCancel">Cancel</button>
    <button type="submit" class="btn primary" id="fSave">Save item</button>
  </div>
</form>
<div class="sheet-bg" id="authBg"></div>
<form class="sheet" id="authSheet" autocomplete="off">
  <h2>Owner sign in</h2>
  <p class="note" style="color:var(--muted);margin:0 0 8px">Paste your GitHub access token. It stays on this device only.</p>
  <label for="aTok">Access token</label>
  <input type="password" id="aTok" placeholder="github_pat_…" required autocomplete="off" spellcheck="false">
  <div class="err" id="aErr" hidden></div>
  <div class="btns">
    <button type="button" class="btn" id="aCancel">Cancel</button>
    <button type="submit" class="btn primary" id="aSave">Sign in</button>
  </div>
</form>
<div class="sheet-bg" id="pinBg"></div>

<script>
/* ================= SETTINGS ================= */
const OWNER = "Lfriestedt";

};
const TRADES = Object.keys(TRADE_SUBS);
const ROOMS = ["Kitchen", "Living room", "Bedroom 1", "Bedroom 2", "Bathroom", "Bathroom 2", "Hallway", "Entry", "Laundry", "Balcony", "Closet"];
/* ============================================ */

const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const app = document.getElementById("app");
const fab = document.getElementById("fab");
document.title = SITE_NAME;

let token = null;
try { token = localStorage.getItem("pl_token"); } catch {}
let isOwner = !!token, ready = false, failed = false, busy = false;
let data = { units: {}, items: [] };
const localPhotos = new Map();   // photo files saved this session, shown before the site rebuilds
let route = parseHash();

// ---------- helpers ----------
const slug = s => String(s || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function parseHash() {
  const p = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  if (p[0] === "unit" && p[1]) return { view: "unit", key: p[1] };
  if (p[0] === "trade" && p[1]) return { view: "trade", key: p[1] };
  if (p[0] === "who" && p[1]) return { view: "who", key: p[1] };
  if (p[0] === "qr") return { view: "qr" };
  if (p[0] === "punch") return { view: "dash" };
  if (p[0] === "pc") return { view: "pc", sub: p[1] || "home", key: p[2] || null, focus: p[3] || null };
  return { view: "home" };
}
const link = r => r.view === "home" ? "#/" : r.view === "dash" ? "#/punch"
  : r.view === "pc" ? "#/pc" + (r.sub && r.sub !== "home" ? "/" + r.sub : "") + (r.key ? "/" + encodeURIComponent(r.key) : "") + (r.focus ? "/" + encodeURIComponent(r.focus) : "")
  : r.key ? `#/${r.view}/${encodeURIComponent(r.key)}` : `#/${r.view}`;
function go(r) { if (location.hash !== link(r)) location.hash = link(r); else { route = r; render(); } }
window.addEventListener("hashchange", () => { route = parseHash(); window.scrollTo(0, 0); render(); });
const pageURL = r => location.origin + location.pathname + link(r);

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(k));
  return n;
}
const items = () => data.items || [];
const unitName = s => data.units?.[s]?.name || items().find(i => i.unit === s)?.unitName || s;
const isOpen = i => i.status !== "done";
const fmtDate = t => t ? new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
function allUnits() {
  const s = new Set([...Object.keys(data.units || {}), ...items().map(i => i.unit)]);
  return [...s].sort((a, b) => unitName(a).localeCompare(unitName(b), undefined, { numeric: true }));
}
function toast(msg) {
  let t = document.getElementById("toast");
  if (!t) { t = el("div", { id: "toast", role: "status" }); document.body.append(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
}
function groupCounts(list, keyFn) {
  const m = new Map();
  for (const i of list) { const k = keyFn(i); m.set(k, (m.get(k) || 0) + 1); }
  return [...m].sort((a, b) => b[1] - a[1]);
}
function photoSrc(path) { return localPhotos.get(path) || path; }

// ---------- GitHub storage ----------
async function gh(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: {
    Authorization: "Bearer " + token, Accept: opts.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
    ...(opts.body ? { "Content-Type": "application/json" } : {}) }, cache: "no-store" });
  if (!r.ok) { const e = new Error("GitHub " + r.status); e.status = r.status; throw e; }
  if (opts.raw) return r.text();
  return r.status === 204 ? null : r.json();
}
async function readViaAPI(ref) {
  try { return JSON.parse(await gh(`/contents/data.json?ref=${ref || BRANCH}`, { raw: true })); }
  catch (e) { if (e.status === 404) return { units: {}, items: [] }; throw e; }
}
async function readPublic() {
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) return await r.json();
    if (r.status === 404) return { units: {}, items: [] };
  } catch {}
  const r = await fetch(RAW + "data.json?t=" + Date.now(), { cache: "no-store" });
  if (r.status === 404) return { units: {}, items: [] };
  if (!r.ok) throw new Error("load failed");
  return r.json();
}
async function load() {
  try {
    const d = isOwner ? await readViaAPI() : await readPublic();
    const was = ready ? JSON.stringify(data) : null;
    if (!busy) { data = ensureData(d); }
    const same = was !== null && was === JSON.stringify(data);
    ready = true; failed = false;
    if (same) return;
  } catch (e) {
    if (isOwner && (e.status === 401 || e.status === 403)) { signOutLocal(); toast("Your access token stopped working. Sign in again."); return load(); }
    if (!ready) failed = true;
  }
  render();
}
// One commit per change: updates data.json and adds/removes photo files together.
async function commit(message, mutate, files = [], deletes = []) {
  busy = true;
  try {
    const blobs = [];
    for (const f of files) {
      const b = await gh("/git/blobs", { method: "POST", body: JSON.stringify({ content: f.base64, encoding: "base64" }) });
      blobs.push({ path: f.path, mode: "100644", type: "blob", sha: b.sha });
    }
    for (let attempt = 0; attempt < 3; attempt++) {
      const head = (await gh(`/git/ref/heads/${BRANCH}`)).object.sha;
      const parent = await gh(`/git/commits/${head}`);
      const fresh = await readViaAPI(head);
      ensureData(fresh);
      mutate(fresh);
      const tree = [{ path: "data.json", mode: "100644", type: "blob", content: JSON.stringify(fresh, null, 1) }, ...blobs,
        ...deletes.map(p => ({ path: p, mode: "100644", type: "blob", sha: null }))];
      const t = await gh("/git/trees", { method: "POST", body: JSON.stringify({ base_tree: parent.tree.sha, tree }) });
      const c = await gh("/git/commits", { method: "POST", body: JSON.stringify({ message, tree: t.sha, parents: [head] }) });
      try {
        await gh(`/git/refs/heads/${BRANCH}`, { method: "PATCH", body: JSON.stringify({ sha: c.sha }) });
        data = fresh; render(); return;
      } catch (e) { if (e.status !== 422) throw e; }
    }
    throw new Error("Someone else saved at the same time. Try again.");
  } finally { busy = false; }
}

// ---------- rendering ----------
function ensureData(d) {
  d.units ||= {}; d.items ||= []; d.drawingFiles ||= {};
  d.procore ||= {}; d.procore.items ||= {}; d.procore.roomPins ||= {}; d.procore.nextNumber ||= 1;
  return d;
}
function render() {
  fab.hidden = !(ready && isOwner && !["qr", "pc", "home"].includes(route.view));
  app.replaceChildren();
  if (failed) { app.append(el("h1", {}, SITE_NAME), el("p", { class: "empty" }, "Couldn’t load the list. Check your connection and reload.")); renderFoot(); return; }
  if (!ready) { app.append(el("p", { class: "empty" }, "Loading punch list…")); return; }
  if (route.view === "unit") renderUnit(route.key);
  else if (route.view === "trade") renderFiltered("trade", route.key);
  else if (route.view === "who") renderFiltered("who", route.key);
  else if (route.view === "qr" && isOwner) renderQR();
  else if (route.view === "pc" && isOwner) renderPC();
  else if (route.view === "dash" && isOwner) renderDashboard();
  else if (isOwner) renderChooser();
  else renderPublicHome();
  renderFoot();
}
function renderFoot() {
  const f = el("div", { class: "foot noprint" });
  if (isOwner) f.append(el("span", {}, "Signed in as owner on this device"), el("button", { class: "link", onclick: () => { signOutLocal(); load(); } }, "Sign out"),
    el("button", { class: "link", onclick: openKey }, typeof aiKey !== "undefined" && aiKey ? "Claude auto-fill: on" : "Set up Claude auto-fill"));
  else f.append(el("button", { class: "link", onclick: openAuth }, "Owner sign in"));
  app.append(f);
}
function rowList(entries, onPick, cls = "") {
  const ul = el("ul", { class: "rows " + cls });
  const top = Math.max(1, ...entries.map(e => e[1]));
  for (const [key, count, label] of entries) {
    ul.append(el("li", {}, el("button", { onclick: () => onPick(key) },
      el("span", { class: "n" }, label ?? key),
      el("span", { class: "bar", "aria-hidden": "true" }, el("i", { style: `width:${Math.round(count / top * 100)}%` })),
      el("span", { class: "count" }, el("b", {}, String(count)), " open"))));
  }
  return ul;
}
function renderDashboard() {
  const open = items().filter(isOpen);
  const weekAgo = Date.now() - 7 * 864e5;
  const doneWeek = items().filter(i => i.status === "done" && i.doneAt > weekAgo).length;
  const unassigned = open.filter(i => !i.assignee).length;
  app.append(
    modeTabs("punch"),
    el("div", { class: "top" }, el("span"), el("button", { class: "link", onclick: () => go({ view: "qr" }) }, "Units & QR codes")),
    el("h1", {}, SITE_NAME),
    el("div", { class: "stats" },
      el("div", { class: "stat" }, el("div", { class: "big" }, String(open.length)), el("span", {}, "open items")),
      el("div", { class: "stat" }, el("div", { class: "big" }, String(doneWeek)), el("span", {}, "done this week")),
      el("div", { class: "stat" }, el("div", { class: "big" }, String(unassigned)), el("span", {}, "unassigned"))));
  if (!items().length) { app.append(el("p", { class: "empty" }, allUnits().length ? "No items yet. Tap “Add item” to log the first one." : "Start by adding your units under “Units & QR codes,” then tap “Add item.”")); return; }
  app.append(el("h2", {}, "By trade"));
  const byTrade = groupCounts(open, i => i.trade || "General");
  app.append(byTrade.length ? rowList(byTrade, k => go({ view: "trade", key: k })) : el("p", { class: "empty" }, "Nothing open."));
  app.append(el("h2", {}, "By person"));
  const byWho = groupCounts(open, i => i.assignee || "");
  app.append(byWho.length ? rowList(byWho.map(([k, c]) => [k, c, k || "Unassigned"]), k => go({ view: "who", key: k || "unassigned" })) : el("p", { class: "empty" }, "Nothing open."));
  app.append(el("h2", {}, "By unit"));
  app.append(rowList(allUnits().map(u => [u, open.filter(i => i.unit === u).length, unitName(u)]), k => go({ view: "unit", key: k }), "units"));
}
function renderPublicHome() {
  const open = items().filter(isOpen);
  app.append(el("h1", {}, SITE_NAME), el("p", { class: "sub" }, `${plural(open.length, "open item", "open items")}. Scan the QR code at a unit door to see its list.`));
  const list = allUnits().map(u => [u, open.filter(i => i.unit === u).length, unitName(u)]);
  if (list.length) app.append(rowList(list, k => go({ view: "unit", key: k }), "units"));
}
function itemCard(it, showUnit) {
  const card = el("div", { class: "item" + (isOpen(it) ? "" : " done") });
  card.append(el("div", {},
    showUnit ? el("div", { class: "where" }, `Unit ${unitName(it.unit)}, ${it.room || "no room"}`) : null,
    el("h3", {}, it.title || "Untitled"),
    it.notes ? el("p", {}, it.notes) : null,
    el("div", { class: "chips" },
      el("span", { class: "chip" }, it.trade || "General"),
      el("span", { class: "chip" + (it.assignee ? "" : " none") }, it.assignee || "Unassigned")),
    el("div", { class: "when" }, isOpen(it) ? `Added ${fmtDate(it.createdAt)}` : `Done ${fmtDate(it.doneAt)}`)));
  if (it.photo) {
    const img = el("img", { src: photoSrc(it.thumb || it.photo), alt: "", loading: "lazy" });
    img.addEventListener("error", function once() { img.removeEventListener("error", once); img.src = RAW + (it.thumb || it.photo) + "?t=" + Date.now(); });
    card.append(el("button", { class: "thumb", "aria-label": it.video ? "Play video" : "Open photo", onclick: () => openPhoto(it) }, img, it.video ? el("span", { class: "vbadge" }, "▶ video") : null));
  } else card.append(el("span"));
  if (isOwner) {
    card.append(el("div", { class: "actions" },
      isOpen(it) ? el("button", { class: "btn", onclick: e => setStatus(it, "done", e.currentTarget) }, "Mark done")
                 : el("button", { class: "btn", onclick: e => setStatus(it, "open", e.currentTarget) }, "Reopen"),
      el("button", { class: "btn", onclick: () => openSheet(it) }, "Edit"),
      el("button", { class: "btn warn", onclick: e => removeItem(it, e.currentTarget) }, "Delete")));
  }
  return card;
}
function sharePanel(r) {
  if (!isOwner) return null;
  const url = pageURL(r);
  const input = el("input", { type: "text", value: url, readonly: "", "aria-label": "Link to this page" });
  return el("div", { class: "sharebox noprint" }, input, el("button", { class: "btn", type: "button", onclick: async () => {
    try { await navigator.clipboard.writeText(url); toast("Link copied"); } catch { input.select(); toast("Press and hold to copy"); }
  } }, "Copy link"));
}
function backLink() { return el("div", { class: "top" }, el("button", { class: "link", onclick: () => go({ view: isOwner ? "dash" : "home" }) }, isOwner ? "‹ Dashboard" : "‹ All units")); }
function renderUnit(u) {
  const mine = items().filter(i => i.unit === u);
  const open = mine.filter(isOpen).sort((a, b) => a.createdAt - b.createdAt);
  const done = mine.filter(i => !isOpen(i)).sort((a, b) => b.doneAt - a.doneAt);
  app.append(backLink(), el("div", { class: "unitno" }, unitName(u)),
    el("div", { class: "unitmeta" }, open.length ? plural(open.length, "item to fix", "items to fix") : "Nothing open in this unit"),
    sharePanel({ view: "unit", key: u }));
  const rooms = new Map();
  for (const it of open) { const r = it.room || "Other"; if (!rooms.has(r)) rooms.set(r, []); rooms.get(r).push(it); }
  for (const [r, list] of [...rooms].sort((a, b) => a[0].localeCompare(b[0]))) {
    app.append(el("div", { class: "room" }, r)); list.forEach(it => app.append(itemCard(it, false)));
  }
  if (!mine.length) app.append(el("p", { class: "empty" }, isOwner ? "Tap “Add item” to log something for this unit." : "No items for this unit."));
  if (done.length) { const d = el("details", { class: "donebox" }, el("summary", {}, `Done (${done.length})`)); done.forEach(it => d.append(itemCard(it, false))); app.append(d); }
}
function renderFiltered(kind, key) {
  const match = kind === "trade" ? i => (i.trade || "General").toLowerCase() === key.toLowerCase()
    : i => key === "unassigned" ? !i.assignee : (i.assignee || "").toLowerCase() === key.toLowerCase();
  const list = items().filter(match);
  const open = list.filter(isOpen).sort((a, b) => unitName(a.unit).localeCompare(unitName(b.unit), undefined, { numeric: true }) || a.createdAt - b.createdAt);
  const done = list.filter(i => !isOpen(i)).sort((a, b) => b.doneAt - a.doneAt);
  app.append(backLink(), el("div", { class: "pagetitle" }, kind === "who" && key === "unassigned" ? "Unassigned" : key),
    el("div", { class: "unitmeta" }, open.length ? `${plural(open.length, "item", "items")} to fix across ${plural(new Set(open.map(i => i.unit)).size, "unit", "units")}` : "Nothing open"),
    sharePanel({ view: kind, key }));
  let last = null;
  for (const it of open) { if (it.unit !== last) { app.append(el("div", { class: "room" }, `Unit ${unitName(it.unit)}`)); last = it.unit; } app.append(itemCard(it, true)); }
  if (done.length) { const d = el("details", { class: "donebox" }, el("summary", {}, `Done (${done.length})`)); done.forEach(it => d.append(itemCard(it, true))); app.append(d); }
}
function renderQR() {
  app.append(el("div", { class: "top" }, el("button", { class: "link", onclick: () => go({ view: "dash" }) }, "‹ Dashboard"),
      el("button", { class: "link", onclick: () => window.print() }, "Print")),
    el("h1", {}, "Units & QR codes"),
    el("p", { class: "sub" }, "Each code opens that unit’s list. Print and post one at each door."));
  const input = el("input", { type: "text", placeholder: "Add units: 101, 102, 201-210", "aria-label": "Units to add" });
  const btn = el("button", { class: "btn primary", type: "button", onclick: async () => {
    const names = expandUnits(input.value); if (!names.length) return;
    btn.disabled = true; btn.textContent = "Adding…";
    try { await commit(`Add units ${names.join(", ")}`, d => names.forEach(n => d.units[slug(n)] = { name: n })); input.value = ""; toast(`Added ${plural(names.length, "unit", "units")}`); }
    catch (e) { toast(e.message.startsWith("Someone") ? e.message : "Couldn’t add units. Try again."); }
    finally { btn.disabled = false; btn.textContent = "Add"; }
  } }, "Add");
  app.append(el("div", { class: "addunit" }, input, btn));
  const grid = el("div", { class: "qrgrid" });
  for (const u of allUnits()) {
    const box = el("div", { class: "qr" });
    grid.append(el("div", { class: "qrcard" }, box, el("div", { class: "n" }, unitName(u))));
    try { new QRCode(box, { text: pageURL({ view: "unit", key: u }), width: 280, height: 280, correctLevel: QRCode.CorrectLevel.M }); } catch {}
  }
  app.append(grid);
}
function expandUnits(text) {
  const out = [];
  for (const part of text.split(/[,\n]+/).map(s => s.trim()).filter(Boolean)) {
    const m = part.match(/^(\d+)\s*-\s*(\d+)$/);
    if (m && +m[2] >= +m[1] && +m[2] - +m[1] < 500) for (let n = +m[1]; n <= +m[2]; n++) out.push(String(n));
    else out.push(part);
  }
  return out.filter(n => slug(n));
}

// ---------- owner actions ----------
async function setStatus(it, status, btn) {
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    await commit(`${status === "done" ? "Done" : "Reopen"}: ${it.title}`, d => {
      const x = d.items.find(i => i.id === it.id); if (x) { x.status = status; x.doneAt = status === "done" ? Date.now() : null; }
    });
    toast(status === "done" ? "Marked done" : "Reopened");
  } catch { toast("Couldn’t update that item. Try again."); render(); }
}
async function removeItem(it, btn) {
  if (!btn.dataset.armed) {
    btn.dataset.armed = "1"; btn.textContent = "Tap again to delete"; btn.classList.add("armed");
    setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = "Delete"; btn.classList.remove("armed"); } }, 4000);
    return;
  }
  btn.disabled = true; btn.textContent = "Deleting…";
  try {
    await commit(`Delete: ${it.title}`, d => { d.items = d.items.filter(i => i.id !== it.id); }, [], data.procore?.items?.[it.id] ? [] : [it.photo, it.thumb, it.video].filter(Boolean));
    toast("Item deleted");
  } catch { toast("Couldn’t delete that item. Try again."); render(); }
}

// ---------- photo viewer ----------
const viewer = document.getElementById("viewer"), viewerImg = viewer.querySelector("img");
const viewerVid = viewer.querySelector("video");
function openPhoto(it) {
  viewerImg.hidden = !!it.video; viewerVid.hidden = !it.video;
  if (it.video) {
    viewerVid.onerror = () => { viewerVid.onerror = null; viewerVid.src = RAW + it.video; };
    viewerVid.src = photoSrc(it.video); viewerVid.play().catch(() => {});
  } else {
    viewerImg.onerror = () => { viewerImg.onerror = null; viewerImg.src = RAW + it.photo + "?t=" + Date.now(); };
    viewerImg.src = photoSrc(it.photo);
  }
  viewer.classList.add("open");
}
viewer.addEventListener("click", e => { if (e.target === viewerVid) return; viewerVid.pause(); viewerVid.removeAttribute("src"); viewer.classList.remove("open"); });

// ---------- sign in ----------
const $ = id => document.getElementById(id);
function openAuth() { $("authSheet").reset(); $("aErr").hidden = true; $("authSheet").classList.add("open"); $("authBg").classList.add("open"); }
function closeAuth() { $("authSheet").classList.remove("open"); $("authBg").classList.remove("open"); }
$("authBg").addEventListener("click", closeAuth);
$("aCancel").addEventListener("click", closeAuth);
$("authSheet").addEventListener("submit", async e => {
  e.preventDefault();
  const t = $("aTok").value.trim(); if (!t) return;
  $("aSave").disabled = true; $("aSave").textContent = "Checking…";
  try {
    const r = await fetch(API, { headers: { Authorization: "Bearer " + t, Accept: "application/vnd.github+json" } });
    if (!r.ok) throw new Error();
    const info = await r.json();
    if (info.permissions && !info.permissions.push) throw new Error();
    token = t; isOwner = true;
    try { localStorage.setItem("pl_token", t); } catch {}

}

function loadProject() {
  if (projectLoading) return projectLoading;
  projectLoading = fetch(PROJECT_FILE, { cache: "force-cache" }).then(r => r.ok ? r.json() : null).then(p => {
    const m = new Map();
    for (const l of (p && p.locations) || []) {
      const parts = String(l.name || "").split(">").map(s => s.trim());
      const ui = parts.findIndex(s => /^unit\s+\w+/i.test(s));

    fillUnitList();

const toJpeg = (src, max, q) => { const k = Math.min(1, max / Math.max(src.width || src.videoWidth, src.height || src.videoHeight));
  const c = document.createElement("canvas"); c.width = Math.round((src.width || src.videoWidth) * k); c.height = Math.round((src.height || src.videoHeight) * k);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", q); };
function videoFrames(file, count = 4) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
    const out = []; let i = 0;
    const fail = () => reject(new Error("video"));
    v.onerror = fail;
    v.onloadedmetadata = () => {
      const d = isFinite(v.duration) && v.duration > 0 ? v.duration : 1;
      const times = Array.from({ length: count }, (_, k) => d * (k + 0.5) / count);
      v.onseeked = () => { out.push({ full: toJpeg(v, 1600, 0.78), ai: toJpeg(v, 1024, 0.7) }); if (++i < times.length) v.currentTime = times[i]; else resolve({ frames: out, url }); };
      v.currentTime = times[0];
    };
    setTimeout(() => out.length ? resolve({ frames: out, url }) : fail(), 20000);
  });
}
const fileToBase64 = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(f); });

async function identify(seq) {

      input_schema: { type: "object", additionalProperties: false, required: ["title", "notes", "trade", "room", "assignee", "confidence"], properties: {
        title: { type: "string", description: "Short problem statement a worker can act on, max ~8 words, e.g. 'Drywall patch needs sanding at outlet'." },
        notes: { type: "string", description: "1-2 sentences: exact location within the photo/room and what fix is needed. Empty if nothing to add." },
        trade: { type: "string", enum: TRADES },

        assignee: { type: "string", description: "Responsible company from the project list if clearly implied by the trade, otherwise empty." },
        confidence: { type: "string", enum: ["high", "medium", "low"] } } } };
    const content = [
      ...cap.frames.map(b => ({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: b.split(",")[1] } })),
      { type: "text", text: `${cap.kind === "video" ? `These are ${cap.frames.length} frames from a short walkthrough video, in order.` : "This is a jobsite photo."}
Project: ${ctx.desc}
Unit: ${$("qUnit").value || "unknown"}. Rooms in this unit: ${(rooms.length ? rooms : ROOMS).join(", ")}.
Trades and the sub responsible for each: ${TRADES.map(t => `${t} = ${TRADE_SUBS[t]}`).join("; ")}. Set assignee to the sub for the trade you choose.${people.length ? `\nPeople already used as assignees: ${people.join(", ")}.` : ""}
Identify the most important punch list deficiency shown (incomplete, damaged or incorrect finish work) and call create_punch_item once. If nothing is clearly wrong, still call it with your best description and confidence "low".` }];
    const r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: {
        "x-api-key": aiKey, "anthropic-version": "2023-06-01", "content-type": "application/json", "anthropic-dangerous-direct-browser-access": "true" },

    notes = $("qNotes").value.trim(), assignee = $("qWho").value.trim(), c = cap;

  const id = newId(), stamp = Date.now().toString(36);
  const photoPath = `photos/${id}-${stamp}.jpg`, thumbPath = `photos/${id}-${stamp}-t.jpg`;
  const keepVideo = c.kind === "video" && c.videoFile.size <= MAX_VIDEO_MB * 1048576;

  localPhotos.set(photoPath, c.full); localPhotos.set(thumbPath, c.thumb); if (videoPath) localPhotos.set(videoPath, c.videoURL);
  pendingSaves++;
  saveQueue = saveQueue.then(async () => {

    .catch(err => { pendingSaves--; toast(err.status === 401 || err.status === 403 ? "Your access token can’t save. Sign in again." : "An item didn’t save. Check your connection and try again."); });
  if (c.kind === "video" && !keepVideo) toast(`Video over ${MAX_VIDEO_MB} MB. Saving still frame only.`);
  return true;
}

async function transferAll(btn) {

    await commit("Transfer punch list to Procore", d => {
      const P = d.procore, now = Date.now(); let added = 0, updated = 0, closed = 0;
      const live = new Set();

        const ex = P.items[it.id], snap = {

}

const isPdf = f => f.type === "application/pdf" || /\.pdf$/i.test(f.name);

async function sheetFromPageText(page) {

async function renderDrawing(file) {

async function importDrawings(files, forced) {
  if (!files.length) return;
  await loadProject();
  const say = t => { if (dwgProgress?.isConnected) dwgProgress.textContent = t; else toast(t); };
  const skipped = [], batch = []; let done = 0;
  const flush = async () => {
    if (!batch.length) return;
    const part = batch.splice(0);
    await commit(`Import drawings: ${part.map(p => p.no).join(", ")}`, d => { for (const p of part) d.drawingFiles[p.no] = { file: p.path, w: p.w, h: p.h, importedAt: Date.now() }; },
      part.map(p => ({ path: p.path, base64: p.url.split(",")[1] })));
  };
  const queue = async (no, r) => {
    const path = `drawings/${no.replace(/[^A-Za-z0-9.-]/g, "_")}-${Date.now().toString(36)}.jpg`;
    localPhotos.set(path, r.url);
    batch.push({ no, path, ...r });
    if (batch.length >= 4) { say(`Uploading… (${done} done)`); await flush(); }
  };
  try {
    for (const f of files) {
      // Combined PDF (several sheets in one file): split it and match each page by its "Unit ###" title.
      if (!forced && isPdf(f)) {
        const lib = await loadPdfJs();
        const doc = await lib.getDocument({ data: await f.arrayBuffer() }).promise;
        if (doc.numPages > 1) {
          const ordered = plDrawings().map(d => d.number).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
          const seen = new Set();
          for (let i = 1; i <= doc.numPages; i++) {
            const page = await doc.getPage(i);
            let no = await sheetFromPageText(page);
            if (!no && doc.numPages === ordered.length) no = ordered[i - 1];
            if (!no || seen.has(no)) { skipped.push(`${f.name} page ${i}`); page.cleanup(); continue; }
            seen.add(no);
            say(`Preparing ${no} (page ${i} of ${doc.numPages})…`);
            done++; await queue(no, await renderPdfPage(page));
          }
          await doc.destroy();
          continue;
        }
      }
      const no = forced || matchSheet(f.name);
      if (!no) { skipped.push(f.name); continue; }
      say(`Preparing ${no} (${++done} of ${files.length})…`);
      await queue(no, await renderDrawing(f));
    }
    say("Uploading…"); await flush();
    say(`Imported ${plural(done, "drawing", "drawings")}.${skipped.length ? ` Skipped (couldn’t match to a sheet): ${skipped.join(", ")}` : ""}`);
    toast(`Imported ${plural(done, "drawing", "drawings")}`);
  } catch (e) { say(e.message === "pdf.js" ? "Couldn’t load the PDF reader. Check your connection." : "Import stopped. Try again with the remaining files."); }
}

  const card = el("div", { class: "pcitem " + it.status });
  card.append(el("div", {},
    el("div", { class: "num" }, `#${it.number}`, el("span", { class: "status " + it.status }, it.status === "open" ? "Open" : "Closed")),
    el("h3", {}, it.title),
    el("div", { class: "loc" }, it.location || `Unit ${it.unitName}${it.room ? ", " + it.room : ""}`),
    it.notes ? el("p", { style: "margin:4px 0 0;color:var(--muted);font-size:15px" }, it.notes) : null,
    el("div", { class: "chips" }, el("span", { class: "chip" }, it.trade), el("span", { class: "chip" + (it.assignee ? "" : " none") }, it.assignee || "Unassigned"))));
  if (it.photo) {
    const img = el("img", { src: photoSrc(it.thumb || it.photo), alt: "", loading: "lazy" });
    img.addEventListener("error", function once() { img.removeEventListener("error", once); img.src = RAW + (it.thumb || it.photo) + "?t=" + Date.now(); });
    card.append(el("button", { class: "thumb", "aria-label": it.video ? "Play video" : "Open photo", onclick: () => openPhoto(it) }, img, it.video ? el("span", { class: "vbadge" }, "▶ video") : null));
  } else card.append(el("span"));
  const acts = [];
  if (it.pin && !opts.onSheet) acts.push(el("button", { class: "btn", onclick: () => go({ view: "pc", sub: "sheet", key: it.pin.sheet, focus: it.id }) }, "View on drawing"));
  if (it.pin && opts.onSheet) acts.push(el("button", { class: "btn", onclick: () => { const st = pzState; if (st) { const r = st.pz.getBoundingClientRect(); st.s = Math.max(st.s, st.fit * 3); st.tx = r.width / 2 - it.pin.x * st.w * st.s; st.ty = r.height / 2 - it.pin.y * st.h * st.s; st.inner.style.transform = `translate(${st.tx}px,${st.ty}px) scale(${st.s})`; st.inner.style.setProperty("--inv", String(1 / st.s)); window.scrollTo({ top: st.pz.offsetTop - 80, behavior: "smooth" }); } } }, "Show pin"));
  if (!it.pin && it.status === "open") {
    if (opts.place) acts.push(el("button", { class: "btn primary", onclick: opts.place }, "Place pin"));
    else if (it.sheet) acts.push(el("button", { class: "btn primary", onclick: () => { route = { view: "pc", sub: "sheet", key: it.sheet, place: it.id }; history.pushState(null, "", link(route)); window.scrollTo(0, 0); render(); } }, "Place pin"));
  }
  acts.push(el("button", { class: "btn", onclick: () => go({ view: "unit", key: it.unit }) }, "Open in punch list"));
  card.append(el("div", { class: "actions" }, ...acts));
  return card;
}
const pinSheet = $("pinSheet"), pinBg = $("pinBg");
function openPin(it) {
  if (!it) return;
  pinSheet.replaceChildren(pcCard(it, { onSheet: true }),
    el("div", { class: "btns" },
      it.status === "open" ? el("button", { class: "btn", type: "button", onclick: () => { closePin(); pzState?.startPlacing(it); } }, "Move pin") : null,
      el("button", { class: "btn primary", type: "button", onclick: closePin }, "Close")));
  pinSheet.querySelectorAll(".pinsel").forEach(n => n.classList.remove("pinsel"));
  document.querySelectorAll(".pin.sel").forEach(n => n.classList.remove("sel"));
  document.querySelector(`.pin[data-id="${it.id}"]`)?.classList.add("sel");
  pinSheet.classList.add("open"); pinBg.classList.add("open");
}
function closePin() { pinSheet.classList.remove("open"); pinBg.classList.remove("open"); }
pinBg.addEventListener("click", closePin);
window.addEventListener("hashchange", closePin);

// ---------- punch list (Procore copy) ----------
let pcFilter = { status: "open", trade: "", q: "" };
function pcPunch() {
  const all = pcItems();
  const tradesUsed = [...new Set(all.map(i => i.trade))].sort();
  const status = el("select", { "aria-label": "Status" }, ...[["open", "Open"], ["closed", "Closed"], ["all", "All"]].map(([v, l]) => el("option", { value: v }, l)));
  const trade = el("select", { "aria-label": "Trade" }, el("option", { value: "" }, "All trades"), ...tradesUsed.map(t => el("option", { value: t }, t)));
  const q = el("input", { type: "search", placeholder: "Search", "aria-label": "Search items" });
  status.value = pcFilter.status; trade.value = pcFilter.trade; q.value = pcFilter.q;
  const list = el("div");
  const draw = () => {
    pcFilter = { status: status.value, trade: trade.value, q: q.value };
    const t = q.value.trim().toLowerCase();
    const shown = all.filter(i => (status.value === "all" || i.status === status.value) && (!trade.value || i.trade === trade.value)
      && (!t || `${i.number} ${i.title} ${i.notes} ${i.location} ${i.assignee}`.toLowerCase().includes(t)))
      .sort((a, b) => unitName(a.unit).localeCompare(unitName(b.unit), undefined, { numeric: true }) || a.number - b.number);
    const kids = []; let lastU = null;
    for (const it of shown) { if (it.unit !== lastU) { kids.push(el("div", { class: "room" }, `Unit ${it.unitName}`)); lastU = it.unit; } kids.push(pcCard(it)); }
    list.replaceChildren(...(kids.length ? kids : [el("p", { class: "empty" }, all.length ? "No items match." : "Nothing here yet. Use “Transfer / update open items” on Procore Home.")]));
  };
  [status, trade].forEach(n => n.addEventListener("change", draw)); q.addEventListener("input", draw);
  app.append(el("div", { class: "filters" }, status, trade, q), list);
  draw();
}

// ---------- photos ----------
function pcPhotos() {
  const withPic = pcItems().filter(i => i.photo).sort((a, b) => b.createdAt - a.createdAt);
  if (!withPic.length) { app.append(el("p", { class: "empty" }, "No photos yet. Photos come over with each transferred item.")); return; }
  const byUnit = new Map(); for (const i of withPic) { const k = i.unitName; if (!byUnit.has(k)) byUnit.set(k, []); byUnit.get(k).push(i); }
  for (const [u, list] of [...byUnit].sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }))) {
    app.append(el("div", { class: "room" }, `Unit ${u}`), el("div", { class: "gallery" }, ...list.map(i => {
      const img = el("img", { src: photoSrc(i.thumb || i.photo), alt: i.title, loading: "lazy" });
      img.addEventListener("error", function once() { img.removeEventListener("error", once); img.src = RAW + (i.thumb || i.photo); });
      return el("button", { type: "button", "aria-label": `#${i.number} ${i.title}`, onclick: () => openPhoto(i) }, img, el("span", { class: "cap" }, `#${i.number} ${i.room || ""}`), i.video ? el("span", { class: "vbadge" }, "▶") : null);
    })));
  }
}

// ---------- boot ----------
render();
load();
setInterval(() => { if (!document.hidden && !busy && !document.querySelector(".sheet.open")) load(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !busy) load(); });
</script>
